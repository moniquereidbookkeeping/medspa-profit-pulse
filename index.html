<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The MedSpa Profit Pulse Calculator</title>
    <style>
        /* Luxury Aesthetic Styling Framework */
        body {
            background-color: #020617; 
            color: #E2E8F0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .app-card {
            background-color: #0F172A; 
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            border: 1px solid rgba(245, 230, 196, 0.2); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 24px;
            box-sizing: border-box;
            position: relative;
        }
        .header h1 {
            color: #F5E6C4; 
            font-size: 22px;
            text-align: center;
            margin: 0;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .header p {
            color: #94A3B8;
            font-size: 11px;
            text-align: center;
            margin: 4px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        /* Softened Tab Navigation Row */
        .tab-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background-color: #020617;
            padding: 4px;
            border-radius: 12px;
            border: 1px solid #1E293B;
            margin-top: 16px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #64748B;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.1s, color 0.1s;
        }
        .tab-btn.active {
            background-color: #1E293B;
            color: #F5E6C4;
            border: 1px solid rgba(245, 230, 196, 0.15);
        }
        .input-group {
            margin-top: 16px;
        }
        .label-text {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94A3B8;
            margin-bottom: 6px;
        }
        .input-row-split {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 8px;
            align-items: center;
        }
        .toggle-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: #020617;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid #1E293B;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: #94A3B8;
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.1s, color 0.1s;
        }
        .toggle-btn.active {
            background-color: #F5E6C4;
            color: #020617;
        }
        .manual-input {
            width: 100%;
            background-color: #020617;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 10px 12px;
            color: #F5E6C4;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
        }
        .manual-input:focus {
            border-color: #D4AF37;
        }
        .rate-suffix-input {
            text-align: center;
            padding: 8px !important;
            font-size: 13px !important;
        }
        /* Custom Mini Numeric Input Box Overlays */
        .pct-box-layout {
            display: flex;
            align-items: center;
            background-color: #020617;
            border: 1px solid #1E293B;
            border-radius: 6px;
            padding: 2px 6px;
            max-width: 60px;
        }
        .pct-box-layout:focus-within {
            border-color: #D4AF37;
        }
        .mini-pct-input {
            width: 100%;
            background: none;
            border: none;
            color: #F5E6C4;
            font-size: 14px;
            font-weight: 700;
            text-align: right;
            outline: none;
            padding: 2px 0;
            -moz-appearance: textfield;
        }
        .mini-pct-input::-webkit-outer-spin-button,
        .mini-pct-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .pct-symbol {
            color: #64748B;
            font-size: 13px;
            font-weight: 600;
            margin-left: 2px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 4px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #1E293B;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #D4AF37;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(212,175,55,0.4);
        }
        .divider {
            margin: 20px 0;
            border-top: 1px solid #1E293B;
        }
        .results-panel {
            background-color: rgba(2, 6, 23, 0.6);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(30, 41, 59, 0.8);
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94A3B8;
            margin-bottom: 8px;
        }
        .result-row span:last-child {
            font-weight: 500;
            color: #CBD5E1;
        }
        .result-row.total-profit {
            border-top: 1px solid #1E293B;
            padding-top: 10px;
            margin-bottom: 4px;
            align-items: baseline;
            color: #E2E8F0;
        }
        .profit-text {
            color: #34D399; 
            font-size: 24px;
            font-weight: 700;
        }
        .margin-text {
            color: #34D399;
            font-weight: 600;
        }
        .alert-box {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.4;
            display: none;
        }
        .alert-warning {
            background-color: rgba(120, 53, 4, 0.15);
            border: 1px solid rgba(180, 83, 9, 0.4);
            color: #FCD34D;
        }
        .alert-danger {
            background-color: rgba(153, 27, 27, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #FCA5A5;
        }
        .alert-title {
            font-weight: 700;
            margin: 0 0 4px 0;
        }
        /* Lead Capture Overlay Popups */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(2, 6, 23, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
            display: none;
        }
        .modal-box {
            background-color: #0F172A;
            border: 1px solid #F5E6C4;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }
        .lead-box {
            margin-top: 16px;
            background-color: #020617;
            border: 1px dashed rgba(245, 230, 196, 0.2);
            padding: 14px;
            border-radius: 12px;
        }
        .cta-btn {
            display: block;
            text-align: center;
            background: linear-gradient(90deg, #D4AF37, #F5E6C4, #D4AF37);
            color: #020617;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 14px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .footer-text {
            text-align: center;
            font-size: 9px;
            color: #64748B;
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>

    <div class="app-card">
        
        <div class="header">
            <h1>THE MEDSPA PROFIT PULSE</h1>
            <p>Find Missing Cash In Your Menu</p>
        </div>

        <!-- Treatment Menu Category Tabs -->
        <div class="tab-container">
            <button id="tabInject" onclick="setCategory('injectables')" class="tab-btn active">Injectables</button>
            <button id="tabLaser" onclick="setCategory('lasers')" class="tab-btn">Lasers & Devices</button>
            <button id="tabFacial" onclick="setCategory('facials')" class="tab-btn">Facials & Skin</button>
        </div>

        <!-- Checkout Selection Layout Row -->
        <div class="input-group">
            <span class="label-text">How Do Clients Pay You?</span>
            <div class="input-row-split">
