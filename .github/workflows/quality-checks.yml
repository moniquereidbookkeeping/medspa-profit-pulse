name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The checks only need to read the code.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependency versions
        run: npm ci --no-audit --no-fund
      - name: Run calculation and server tests
        run: npm run test
      - name: Type-check project
        run: npm run lint
      - name: Build production assets
        run: npm run build
      - name: Check live dependencies for known security problems
        # Reports problems without blocking unrelated work; Dependabot opens the fix.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
