# Opens a pull request when a dependency has a security fix or a safe update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Big version jumps (for example Vite 8, React 19, TypeScript 7) need real testing, so they are done by hand,
    # on purpose, not proposed automatically every week.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
